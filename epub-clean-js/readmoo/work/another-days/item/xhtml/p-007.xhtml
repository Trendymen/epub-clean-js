<p id="mokuji-0007" class="moofs16 moolh28"/>

<p class="moofs16 moolh28">　　不過嘛，她是個擅長撒謊的人，所以也可能只是藏得很好。</p>

<p class="moofs16 moolh28"><br/></p>

<p class="moofs16 moolh28">　　．沙季的情緒</p>

<p class="moofs16 moolh28">　　聽到悠太和讀賣前輩去看電影，沙季心中萌生了某種情感。</p>

<p class="moofs16 moolh28">　　好啦，它究竟是什麼呢？現代文的閱讀測驗裡恐怕找不到這麼簡單的問題吧。</p>

<p class="moofs16 moolh28">　　不過，實際上沙季究竟抱有怎樣的情感呢？她又是怎麼處理呢？這部分要留待下集揭曉。</p>

<p class="moofs16 moolh28">　　讀賣前輩是第一個指出沙季有可能喜歡上悠太的人，這也成了悠太意識到沙季的契機。</p>

<p class="moofs16 moolh28">　　這時候的悠太完全沒考慮過這種可能性，他本人也沒有對沙季抱持任何戀愛感情，所以輕描淡寫地帶過……</p>

</div>
