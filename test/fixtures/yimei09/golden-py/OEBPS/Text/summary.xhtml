<div class="summary">
<h3>简介</h3>
<hr/>
<p>我紧紧握住他牵着我的那只手，一点都不想放开。</p>
<p>在校是「情侣」，在家是「兄妹」。</p>
<p>悠太与沙季通过磨合找出适当距离，</p>
<p>但是紧接着就因为父母不在而要度过「完全只有两个人的两天」，</p>
<p>两人真的能继续维持适当的距离吗……？</p>
<p>另一方面，学校活动、朋友的青春与加油、与打工新人「后辈小妹」的交流等，</p>
<p>崭新的风毫不留情地吹向悠太与沙季……？</p>
<p>「相遇」至今一年，历经许多事而改变的两人，迎来高中生活最后的夏天。</p>
<p>经历过友情、青春、新的相遇之后，「兄妹」所面对的感情是──</p>
